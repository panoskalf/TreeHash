name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.fc-cache
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('Dependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure
        run: cmake -S . -B build -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.fc-cache

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18

      - name: Lint
        run: clang-tidy-18 -p build main.cpp